name: QA Gates

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  technical-enforcement:
    name: Technical Enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Enforce UI surface taxonomy
        run: npm run lint:surfaces

      - name: Enforce chrome surface tokens
        run: npm run lint:chrome

      - name: Validate Next.js segment config exports
        run: node scripts/check-segment-configs.mjs

  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type checking
        run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Upload coverage reports
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: ./coverage/coverage-final.json
          flags: unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload E2E test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run security tests
        run: npm run test:security
        env:
          CI: true

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [technical-enforcement, lint-and-typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Check build output
        run: ls -la .next/

  qa-summary:
    name: QA Summary
    runs-on: ubuntu-latest
    needs: [technical-enforcement, lint-and-typecheck, unit-tests, integration-tests, e2e-tests, security-tests, build]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          echo "All QA gates completed!"
          echo "? Technical Enforcement: ${{ needs.technical-enforcement.result }}"
          echo "? Lint & TypeCheck: ${{ needs.lint-and-typecheck.result }}"
          echo "? Unit Tests: ${{ needs.unit-tests.result }}"
          echo "? Integration Tests: ${{ needs.integration-tests.result }}"
          echo "? E2E Tests: ${{ needs.e2e-tests.result }}"
          echo "? Security Tests: ${{ needs.security-tests.result }}"
          echo "? Build: ${{ needs.build.result }}"

      - name: Fail if any job failed
        if: |
          needs.technical-enforcement.result == 'failure' ||
          needs.lint-and-typecheck.result == 'failure' ||
          needs.unit-tests.result == 'failure' ||
          needs.integration-tests.result == 'failure' ||
          needs.e2e-tests.result == 'failure' ||
          needs.security-tests.result == 'failure' ||
          needs.build.result == 'failure'
        run: |
          echo "? One or more QA gates failed!"
          exit 1
