name: QA Gates

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

env:
  CI: true
  NEXT_PUBLIC_SITE_URL: https://ci.brolab.invalid
  NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_dGVzdC5jbGVyay5hY2NvdW50cy5kZXYk
  CLERK_SECRET_KEY: sk_test_ci_only
  CLERK_JWT_ISSUER_DOMAIN: https://test.clerk.accounts.dev
  CLERK_WEBHOOK_SECRET: whsec_ci_clerk
  NEXT_PUBLIC_CONVEX_URL: https://ci-test.convex.cloud
  CONVEX_DEPLOYMENT: dev:ci-test
  STRIPE_SECRET_KEY: sk_test_ci_only
  NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_ci_only
  STRIPE_CONNECT_CLIENT_ID: ca_ci_only
  STRIPE_WEBHOOK_SECRET: whsec_ci_platform
  STRIPE_CONNECT_WEBHOOK_SECRET: whsec_ci_connect
  RESEND_API_KEY: re_ci_only
  ALLOW_TEST_CREDENTIALS_IN_PRODUCTION: true

jobs:
  technical-enforcement:
    name: Technical Enforcement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Enforce UI surface taxonomy
        run: npm run lint:surfaces

      - name: Enforce chrome surface tokens
        run: npm run lint:chrome

      - name: Validate Next.js segment config exports
        run: node scripts/check-segment-configs.mjs

  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type checking
        run: npm run typecheck

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run integration tests
        run: npm run test:integration

  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          CI: true

      - name: Upload E2E test results
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

  security-tests:
    name: Security Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run security tests
        run: npm run test:security
        env:
          CI: true

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [technical-enforcement, lint-and-typecheck, unit-tests]
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Check build output
        run: ls -la .next/

  qa-summary:
    name: QA Summary
    runs-on: ubuntu-latest
    needs: [technical-enforcement, lint-and-typecheck, unit-tests, integration-tests, e2e-tests, security-tests, build]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          echo "All QA gates completed!"
          echo "? Technical Enforcement: ${{ needs.technical-enforcement.result }}"
          echo "? Lint & TypeCheck: ${{ needs.lint-and-typecheck.result }}"
          echo "? Unit Tests: ${{ needs.unit-tests.result }}"
          echo "? Integration Tests: ${{ needs.integration-tests.result }}"
          echo "? E2E Tests: ${{ needs.e2e-tests.result }}"
          echo "? Security Tests: ${{ needs.security-tests.result }}"
          echo "? Build: ${{ needs.build.result }}"

      - name: Fail if any job failed
        if: |
          needs.technical-enforcement.result != 'success' ||
          needs.lint-and-typecheck.result != 'success' ||
          needs.unit-tests.result != 'success' ||
          needs.integration-tests.result != 'success' ||
          needs.e2e-tests.result != 'success' ||
          needs.security-tests.result != 'success' ||
          needs.build.result != 'success'
        run: |
          echo "? One or more QA gates failed!"
          exit 1
